# Correcao (2026-09-03): deteccao automatica de flexibilidade (nseg2=-1, default)
# so libera residuos do peptideo proximos da interface -- para um peptideo de
# 75 aa com linkers (GGS)3 isso deixava a cadeia inteira presa no conformero
# rigido de entrada (RMSD ~0.4 A vs a helice do ensemble; pose final virava
# uma "vara reta" de ~110 A sem suporte experimental). Forca o peptideo
# inteiro (molecula 2, resi 1-75) como segmento semi-flexivel.
nseg2 = 1
seg_sta_2_1 = 1
seg_end_2_1 = 75

[caprieval]

[emref]
